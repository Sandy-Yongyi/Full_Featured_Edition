# 第三种模式：四台设备共18轴，另有201～204四个激光轴，共22轴。
# 每台设备仅一套配置，不区分柜体和平板。
# SN0 左侧面，SN1 左二维，SN2 右侧面，SN3 右二维。
# U/U1/U2沿用项目已统一的X/X1/X2命名。
# axis_type按设备组织，PLC报文的交错轴序以MachineAxisMap为准。
# 喷涂时工件静止，由设备Z轴沿工件移动；xn_rotate负责侧面及顶底喷涂。
# 每侧xn_rotate与z_2d_lift共用机械Z轴，Z指令仅由xn_rotate写入。
# z_2d_lift只有独立Y/X伺服轴，随同侧xn_rotate的Z轴移动，不单独配置Z轴。
# 两台侧面设备的数值参数保留原配置，尚未据本次轴清单重新确认。

# 左边侧面喷涂机，PLC索引：Z=0,Y1=12,X1=13,R1=14,Y2=6,X2=7,R2=8。
[0]
sn = 0
type = "xn_rotate"
x_position = 1035
z_position = 8570
spray_num = 2
axis_type = ["z", "y1", "x1", "r1", "y2", "x2", "r2"]
spray_radius = 80
out_front_x_offset = 100
out_after_x_offset = 100
out_up_y_offset = 100
out_down_y_offset = 100
out_z_front_offset = 200
out_z_after_offset = 200
z_back_speed = 25
x_pos_speed = 300
x_recip_speed = 100
y_pos_speed = 300
y_recip_speed = 100
outside_total_cycles = 2
install_orietation = "left"
max_limit_speed = [50, 500, 500, 160]
min_limit_pos = [0, 0, 0, -135]       # 旋转轴0时顶枪朝下，底枪朝上，+90都是向前水平，负向后水平
max_limit_pos = [3000, 1300, 1150, 135]
origin_pos = [1600, 2900]
safe_pos = [0, 0, 0, 0]

